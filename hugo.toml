baseURL = 'https://lycat475.com/'
title = 'lycat475 的 blog'
defaultContentLanguage = 'zh'
disableKinds = ['taxonomy', 'term']

[languages]
  [languages.zh]
    locale = 'zh-CN'
    label = '中文'

[pagination]
  pagerSize = 20

[params]
  name = 'lycat475 的 blog'
  h1 = 'LYCAT475'
  intro = 'A new CTFer && a photography beginner'
  author = 'lycat475'
  signNote = 'by lycat475'

  # 上线开关：true 时全站只显示「准备中」页面
  holding = false
  holdingTitle = '还没准备好喵'
  holdingNote = '摸鱼好爽喵~ 噫噫噫补药电窝了本喵马上就干活喵'

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[markup.goldmark.renderer]
  unsafe = false

[markup.goldmark.parser]
  # 独立成段的图片不再包进 <p>，由 render-image 输出带编号的 <figure>
  wrapStandAloneImageWithinParagraph = false

[markup.highlight]
  # 颜色由 assets/css/main.css 的 .chroma 规则决定
  noClasses = false
  lineNos = false

[[menus.main]]
  name = '归档'
  pageRef = '/posts'
  weight = 10
  [menus.main.params]
    en = 'ARCHIVE'
[[menus.main]]
  name = '相册'
  pageRef = '/gallery'
  weight = 20
  [menus.main.params]
    en = 'PLATES'
[[menus.main]]
  name = '关于'
  pageRef = '/about'
  weight = 30
  [menus.main.params]
    en = 'ABOUT'
